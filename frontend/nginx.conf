server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: ogni rotta sconosciuta torna index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # proxy verso il backend Express (stesso dominio -> niente problemi di CORS)
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Immagini e font.
  # "no-cache" non vuol dire "non salvare": il browser tiene la copia ma
  # chiede sempre al server se e' cambiata (e riceve un 304 leggerissimo se
  # non lo e'). Serve perche' le foto dei campi vengono sostituite mantenendo
  # lo stesso nome: con "expires 30d" il browser continuava a mostrare la
  # versione vecchia per un mese senza nemmeno chiedere.
  location ~* \.(png|jpg|jpeg|svg|webp|woff2?)$ {
    add_header Cache-Control "public, no-cache";
  }
}
